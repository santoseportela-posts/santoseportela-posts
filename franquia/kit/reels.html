<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Reels 1080x1920 — sobrescreve o tamanho do post */
  html, body { width: 1080px; height: 1920px; }
  .cena { position: absolute; left: 96px; right: 96px; top: 470px; z-index: 2; }
  .kicker { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 64px; margin-bottom: 36px; }
  .cena h1 { font-family: var(--serif); font-weight: 400; font-size: 96px; line-height: 1.16; letter-spacing: -0.5px; }
  .cena h1 em { font-style: italic; color: var(--gold); }
  .cena p { font-family: var(--sans); font-size: 34px; line-height: 1.7; margin-top: 44px; color: #B7BDC6; max-width: 820px; }
  body.claro .cena p { color: var(--ink-soft); }
  .linha { display: block; }
  #final { position: absolute; left: 0; right: 0; top: 760px; text-align: center; z-index: 2; }
  #final img { width: 340px; }
  #final p { font-family: var(--sans); font-size: 32px; letter-spacing: 1px; margin-top: 48px; color: #B7BDC6; }
  body.claro #final p { color: var(--ink-soft); }
  svg.arcos { position: absolute; inset: 0; z-index: 0; }
  body::before { z-index: 1; }
</style></head>
<body class="escuro">
<svg class="arcos" id="arcos" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div id="cenas"></div>
<div id="final"><img id="logo" src="logos/logo_franquia_fundo_claro.png" alt=""><p>@santoseportelafranquias</p></div>
<script>
/* Roteiro vem de window.ROTEIRO (definido pelo reels.py):
   { fundo: "escuro"|"claro", cenas: [ {kicker, linhas:[...], em, sub, dur} ], final_dur } */
const R = window.ROTEIRO;
const Q = "M0 0 A200 200 0 0 1 200 200 L110 200 A110 110 0 0 0 0 90 Z";
/* Franquia: só existe a logo oficial para fundo claro; o fundo é sempre claro até chegar a versão branca/dourada */
R.fundo = 'claro';
document.body.className = R.fundo;
document.getElementById('logo').src = 'logos/logo_franquia_fundo_claro.png';
const cor = R.fundo === 'escuro' ? '#1A3557' : '#E9E1D3', ouro = '#B07A3C';
// composição "coluna" do topo do site, no canto inferior direito, abaixo do texto
const k = 0.8, ox = 600, oy = 1170;
const arcs = [[400,0,90],[400,210,0],[190,420,270],[400,420,180,1],[400,630,90],[190,630,0]];
const svg = document.getElementById('arcos');
arcs.forEach(([X,Y,r,g],i)=>{
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',Q); p.setAttribute('fill', g?ouro:cor);
  p.dataset.base = `translate(${ox+X*k} ${oy+Y*k}) scale(${k}) rotate(${r} 100 100)`;
  p.dataset.i = i; svg.appendChild(p);
});
const box = document.getElementById('cenas');
let t0 = 0;
R.cenas.forEach(c=>{
  const d = document.createElement('div'); d.className='cena';
  d.innerHTML = (c.kicker?`<div class="kicker linha">${c.kicker}</div>`:'') +
    `<h1>${c.linhas.map(l=>`<span class="linha">${l}</span>`).join('')}${c.em?`<em class="linha">${c.em}</em>`:''}</h1>` +
    (c.sub?`<p class="linha">${c.sub}</p>`:'');
  d.dataset.t0 = t0; d.dataset.dur = c.dur; t0 += c.dur; box.appendChild(d);
});
const tFinal = t0, TOTAL = t0 + R.final_dur;
window.TOTAL = TOTAL;
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
window.setT = function(t){
  // arcos entram escalonados e respiram devagar
  svg.querySelectorAll('path').forEach(p=>{
    const i = +p.dataset.i, a = ease((t - 0.15*i) / 0.7);
    const drift = Math.sin((t+i)*0.6)*4;
    p.setAttribute('opacity', a);
    p.setAttribute('transform', `translate(0 ${(1-a)*60 + drift}) ` + p.dataset.base);
  });
  // cenas: cada linha entra com atraso; a cena sai com fade
  box.querySelectorAll('.cena').forEach(c=>{
    const s = +c.dataset.t0, dur = +c.dataset.dur, lt = t - s;
    const out = 1 - ease((lt - (dur - 0.45)) / 0.45);
    c.style.opacity = (lt < 0 || lt > dur) ? 0 : out;
    c.querySelectorAll('.linha').forEach((l,j)=>{
      const a = ease((lt - 0.35 - 0.28*j) / 0.6);
      l.style.opacity = a; l.style.transform = `translateY(${(1-a)*28}px)`;
    });
  });
  const f = ease((t - tFinal) / 0.7), fin = document.getElementById('final');
  fin.style.opacity = f; fin.style.transform = `translateY(${(1-f)*24}px)`;
  svg.style.opacity = 1 - ease((t - tFinal) / 0.7);
};
setT(0);
</script>
</body></html>
